<!doctype html>
<html lang="en" class="widget-root">
<head>
  <meta charset="UTF-8" />
  <title>CoKo widget</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="widget.css" />
</head>
<body class="widget">
  <div class="w-bubble" id="bubble"></div>
  <div class="w-stage" id="stage" title="Click: open dashboard · Drag: move · Right-click: today's stats">
    <div id="mascot" class="w-mascot"></div>
    <div class="w-badge" id="badge">
      <svg viewBox="0 0 36 36" class="w-ring"><circle cx="18" cy="18" r="15" class="bg"/><circle cx="18" cy="18" r="15" class="fg" id="ring"/></svg>
      <span id="bTime">0m</span>
      <span class="w-batt" id="bBatt"></span>
    </div>
  </div>
  <script src="assets/koko/sprites.js"></script>
  <script src="mascot.js"></script>
  <script src="character.js"></script>
  <script src="widget.js"></script>
</body>
</html>
